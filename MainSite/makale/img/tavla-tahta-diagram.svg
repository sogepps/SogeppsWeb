<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-label="Tavla tahtası bölgeleri">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a1f2e"/><stop offset="100%" stop-color="#0f1218"/></linearGradient>
</defs>
<rect width="760" height="420" rx="16" fill="url(#bg)"/>
