<!-- Top-right: Rakibin ev bölgesi (19-24) -->
<rect x="440" y="156" width="200" height="24" rx="4" fill="rgba(201,162,39,0.15)" stroke="rgba(201,162,39,0.3)" stroke-width="1"/>
