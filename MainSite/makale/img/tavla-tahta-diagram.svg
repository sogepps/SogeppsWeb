<g opacity="0.6">
<!-- Left top (13-18): Rakibin dış bölgesi -->
<polygon points="50,38 80,38 65,148" fill="#c9a227" opacity="0.5"/>
<polygon points="100,38 130,38 115,148" fill="#6366f1" opacity="0.4"/>
<polygon points="150,38 180,38 165,148" fill="#c9a227" opacity="0.5"/>
