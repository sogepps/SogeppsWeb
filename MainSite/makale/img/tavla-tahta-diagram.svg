<!-- Top-left: Rakibin dış bölgesi (13-18) -->
<rect x="90" y="156" width="180" height="24" rx="4" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>
