<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-label="Tavla kırma ve bar">
<rect width="760" height="260" rx="16" fill="#0f1218"/>
<!-- Scene: a piece hitting a blot -->
<text x="380" y="28" font-family="Segoe UI,sans-serif" font-size="14" fill="#f0f4f8" text-anchor="middle" font-weight="700">Kırma (Vurma) ve Bar'dan Giriş</text>
<!-- Mini board section showing points 4-8 -->
<rect x="80" y="45" width="300" height="170" rx="8" fill="#1e2636" stroke="#3a4a6a" stroke-width="1.5"/>
<g opacity="0.5">
<polygon points="100,53 130,53 115,133" fill="#c9a227"/>
<polygon points="150,53 180,53 165,133" fill="#4a5580"/>
<polygon points="200,53 230,53 215,133" fill="#c9a227"/>
<polygon points="250,53 280,53 265,133" fill="#4a5580"/>
<polygon points="300,53 330,53 315,133" fill="#c9a227"/>
</g>
<!-- White pieces on point 8 (2 pieces) -->
<circle cx="115" cy="67" r="13" fill="#f0f4f8" stroke="#c7ced8" stroke-width="1.5"/>
<circle cx="115" cy="95" r="13" fill="#f0f4f8" stroke="#c7ced8" stroke-width="1.5"/>
<!-- Black blot on point 5 (single piece - vulnerable!) -->
<circle cx="265" cy="67" r="13" fill="#374151" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,2"/>
<text x="265" y="72" font-family="Segoe UI,sans-serif" font-size="8" fill="#ef4444" text-anchor="middle" font-weight="700">BLOT</text>
<!-- Arrow: white hits black -->
<defs><marker id="hArrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#ef4444"/></marker></defs>
<path d="M130,67 Q200,40 250,67" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#hArrow)" stroke-dasharray="6,3"/>
<text x="190" y="38" font-family="Segoe UI,sans-serif" font-size="10" fill="#ef4444" text-anchor="middle" font-weight="600">3 hane → kır!</text>
<!-- Dice showing 3 -->
<rect x="100" y="140" width="30" height="30" rx="5" fill="#f0f4f8" stroke="#c7ced8" stroke-width="1"/>
<circle cx="115" cy="149" r="2.5" fill="#1e2636"/><circle cx="115" cy="155" r="2.5" fill="#1e2636"/><circle cx="115" cy="161" r="2.5" fill="#1e2636"/>
<!-- Point labels -->
<text x="115" y="207" font-family="Segoe UI,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">8</text>
<text x="165" y="207" font-family="Segoe UI,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">7</text>
<text x="215" y="207" font-family="Segoe UI,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">6</text>
<text x="265" y="207" font-family="Segoe UI,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">5</text>
<text x="315" y="207" font-family="Segoe UI,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">4</text>
<!-- BAR section on the right -->
<rect x="440" y="45" width="100" height="170" rx="8" fill="#2a3448" stroke="#3a4a6a" stroke-width="1.5"/>
<text x="490" y="65" font-family="Segoe UI,sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle" font-weight="700">BAR</text>
<!-- Black piece on bar -->
<circle cx="490" cy="100" r="15" fill="#374151" stroke="#6b7280" stroke-width="2"/>
<!-- Arrow from blot to bar -->
<defs><marker id="bArrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#f59e0b"/></marker></defs>
<path d="M280,67 Q370,50 475,90" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#bArrow)" stroke-dasharray="6,3"/>
<text x="390" y="58" font-family="Segoe UI,sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="600">Bar'a gider</text>
<!-- Re-entry arrow from bar -->
<rect x="580" y="45" width="150" height="170" rx="8" fill="#1e2636" stroke="#3a4a6a" stroke-width="1.5"/>
<text x="655" y="220" font-family="Segoe UI,sans-serif" font-size="9" fill="#9ca3af" text-anchor="middle">Rakibin ev bölgesi</text>
<g opacity="0.5">
<polygon points="600,53 620,53 610,113" fill="#c9a227"/>
<polygon points="635,53 655,53 645,113" fill="#4a5580"/>
<polygon points="670,53 690,53 680,113" fill="#c9a227"/>
</g>
<defs><marker id="gArrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#34d399"/></marker></defs>
<path d="M490,120 Q540,160 640,67" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#gArrow)" stroke-dasharray="6,3"/>
<text x="560" y="145" font-family="Segoe UI,sans-serif" font-size="10" fill="#34d399" text-anchor="middle" font-weight="600">Zarla geri gir</text>
<!-- Footer explanation -->
<text x="380" y="248" font-family="Segoe UI,sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">Tek taş (blot) kırılır → bar'a gider → zar atarak rakibin ev bölgesinden geri girer</text>
</svg>
